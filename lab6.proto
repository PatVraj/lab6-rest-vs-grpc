syntax = "proto3";

service Lab6Service {
    rpc Add (addMsg) returns (addReply);
    rpc RawImage (rawImageMsg) returns (imageReply);
    rpc DotProduct (dotProductMsg) returns (dotProductReply);
    rpc JsonImage (jsonImageMsg) returns (imageReply);
}

// ADD
message addMsg {
    int32 a = 1;
    int32 b = 2;
}

message addReply {
    int32 sum = 1;
}

// RAW IMAGE
message rawImageMsg {
    bytes img = 1;
}

// DOT PRODUCT
message dotProductMsg {
    repeated float a = 1;
    repeated float b = 2;
}

message dotProductReply {
    float dotproduct = 1;
}

// JSON IMAGE
message jsonImageMsg {
    string img = 1;
}

// SHARED IMAGE RESPONSE
message imageReply {
    int32 width = 1;
    int32 height = 2;
}

